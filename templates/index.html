<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Song Recommender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #f857a6, #ff5858);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
        }

        .upload-area {
            border: 2px dashed #555;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.03);
        }

        .upload-area:hover {
            border-color: #f857a6;
            background: rgba(248, 87, 166, 0.05);
        }

        .upload-area.dragover {
            border-color: #f857a6;
            background: rgba(248, 87, 166, 0.1);
        }

        .upload-area img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin-bottom: 1rem;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        #file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(to right, #f857a6, #ff5858);
            border: none;
            color: #fff;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f857a6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 2rem;
        }

        .results.active {
            display: block;
        }

        .analysis-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .analysis-section h3 {
            margin-bottom: 0.8rem;
            color: #f857a6;
        }

        .tag {
            display: inline-block;
            background: rgba(248, 87, 166, 0.2);
            border: 1px solid rgba(248, 87, 166, 0.3);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            margin: 0.2rem;
            font-size: 0.85rem;
        }

        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .song-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            transition: background 0.2s;
        }

        .song-card:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .song-card img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .song-info {
            flex: 1;
        }

        .song-name {
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .song-artist {
            color: #aaa;
            font-size: 0.9rem;
        }

        .song-link {
            color: #1DB954;
            text-decoration: none;
            font-size: 0.85rem;
            padding: 0.4rem 1rem;
            border: 1px solid #1DB954;
            border-radius: 20px;
            transition: all 0.2s;
        }

        .song-link:hover {
            background: #1DB954;
            color: #000;
        }

        .error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vibe Song Recommender</h1>
        <p class="subtitle">Upload a photo and get song recommendations that match its mood</p>

        <div class="upload-area" id="upload-area">
            <div id="upload-placeholder">
                <div class="upload-icon">📸</div>
                <p>Drop your photo here or click to upload</p>
                <p style="color: #666; font-size: 0.85rem; margin-top: 0.5rem;">PNG, JPG, WEBP up to 16MB</p>
            </div>
            <img id="preview" style="display: none;">
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div style="text-align: center;">
            <button class="btn" id="analyze-btn" disabled>Find My Vibe</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing your photo's vibe...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="analysis-section">
                <h3>Detected Vibe</h3>
                <div id="mood-tags"></div>
            </div>

            <div class="analysis-section">
                <h3>Scene & Colors</h3>
                <div id="scene-tags"></div>
            </div>

            <div class="analysis-section">
                <h3>Recommended Songs</h3>
                <div class="songs-list" id="songs-list"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const placeholder = document.getElementById('upload-placeholder');
        const analyzeBtn = document.getElementById('analyze-btn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorDiv = document.getElementById('error');

        let selectedFile = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
                placeholder.style.display = 'none';
            };
            reader.readAsDataURL(file);
            analyzeBtn.disabled = false;
            results.classList.remove('active');
            errorDiv.classList.remove('active');
        }

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            analyzeBtn.disabled = true;
            loading.classList.add('active');
            results.classList.remove('active');
            errorDiv.classList.remove('active');

            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Something went wrong');
                }

                displayResults(data);
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.add('active');
            } finally {
                loading.classList.remove('active');
                analyzeBtn.disabled = false;
            }
        });

        function displayResults(data) {
            const moodTags = document.getElementById('mood-tags');
            moodTags.innerHTML = data.analysis.moods
                .map(m => `<span class="tag">${m.label} (${(m.score * 100).toFixed(0)}%)</span>`)
                .join('');

            const sceneTags = document.getElementById('scene-tags');
            sceneTags.innerHTML = [
                ...data.analysis.scenes.map(s => `<span class="tag">${s.label}</span>`),
                ...data.analysis.colors.map(c => `<span class="tag">${c.label}</span>`),
            ].join('');

            const songsList = document.getElementById('songs-list');
            songsList.innerHTML = data.songs.map(song => `
                <div class="song-card">
                    ${song.album_art ? `<img src="${song.album_art}" alt="${song.album}">` : ''}
                    <div class="song-info">
                        <div class="song-name">${song.name}</div>
                        <div class="song-artist">${song.artist}</div>
                    </div>
                    <a href="${song.spotify_url}" target="_blank" class="song-link">Open in Spotify</a>
                </div>
            `).join('');

            results.classList.add('active');
        }
    </script>
</body>
</html>
